name: Novo cinema ou sala
description: Envie dados para cadastrar uma nova rede, cinema ou sala.
title: "[dados] "
labels:
  - dados
  - nova-entrada
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por contribuir com o CinemasWiki.

        Preencha o que souber. Campos técnicos desconhecidos podem ficar como "A confirmar".
  - type: input
    id: rede
    attributes:
      label: Rede
      description: Nome da rede ou operador independente.
      placeholder: "Ex: Cinemark, UCI, Cine Marquise"
    validations:
      required: true
  - type: input
    id: cinema
    attributes:
      label: Cinema
      description: Nome do cinema.
      placeholder: "Ex: Cinépolis JK Iguatemi"
    validations:
      required: true
  - type: input
    id: cidade_estado
    attributes:
      label: Cidade e estado
      placeholder: "Ex: São Paulo, SP"
    validations:
      required: true
  - type: input
    id: bairro_endereco
    attributes:
      label: Bairro ou endereço
      placeholder: "Ex: Vila Nova Conceição, Av. Presidente Juscelino Kubitschek, 2041"
  - type: input
    id: sala
    attributes:
      label: Sala
      description: Informe somente o número ou nome próprio. Registre VIP, IMAX, Laser e outras classificações nos campos abaixo.
      placeholder: "Ex: Sala 1 ou Sala 1 – Leon Cakoff"
    validations:
      required: true
  - type: dropdown
    id: tipo_sala
    attributes:
      label: Tipo de sala
      options:
        - VIP
        - VIP Lounge
        - A confirmar
  - type: dropdown
    id: sistema
    attributes:
      label: Sistema
      description: IMAX, Macro XE, XD, Cinépic e UCI XPLUS são sistemas; Laser, Xenon e 70 mm são detalhes da projeção.
      options:
        - IMAX
        - Macro XE
        - XD
        - Cinépic
        - UCI XPLUS
        - A confirmar
  - type: dropdown
    id: experiencia
    attributes:
      label: Experiência
      description: Recursos adicionais da sessão. É possível selecionar mais de uma opção.
      multiple: true
      options:
        - 3D
        - 4DX — efeitos físicos
        - A confirmar
  - type: dropdown
    id: tecnologia_projecao
    attributes:
      label: Tecnologia de projeção
      options:
        - Laser
        - Laser RGB
        - Xenon
        - LED
        - Película 70 mm
        - Tela LED
        - A confirmar
  - type: dropdown
    id: resolucao
    attributes:
      label: Resolução
      options:
        - 2K
        - 4K
        - A confirmar
  - type: dropdown
    id: formato_som
    attributes:
      label: Som
      options:
        - Multicanal
        - Dolby Digital
        - Dolby Atmos
        - DTS:X
        - IMAX
        - A confirmar
  - type: dropdown
    id: layout_som
    attributes:
      label: Layout de canais
      options:
        - "5.1"
        - "7.1"
        - "11.1"
        - A confirmar
  - type: dropdown
    id: processador_som
    attributes:
      label: Processamento de áudio
      options:
        - Harman Quantum Logic (JBL)
        - A confirmar
  - type: dropdown
    id: tecnologia_tela
    attributes:
      label: Tecnologia da tela
      options:
        - LED modular
        - A confirmar
  - type: dropdown
    id: superficie_tela
    attributes:
      label: Superfície da tela
      options:
        - Perolizada
        - A confirmar
  - type: dropdown
    id: geometria_tela
    attributes:
      label: Geometria da tela
      options:
        - Plana
        - Curva
        - A confirmar
  - type: textarea
    id: detalhes_projecao
    attributes:
      label: Detalhes da projeção
      description: Marca, modelo, fonte de luz, quantidade de projetores ou observações.
      placeholder: |
        Ex:
        - Marca/modelo: Barco DP4K-30L
        - Fonte de luz: Laser RGB
        - Projetores: dois
  - type: textarea
    id: detalhes_tela
    attributes:
      label: Detalhes da tela
      description: Proporção, largura, altura, área, diagonal ou observações.
      placeholder: |
        Ex:
        - Área: 185 m²
        - Largura/altura: 20 m x 18 m
  - type: textarea
    id: detalhes_som
    attributes:
      label: Detalhes do som
      description: Canais, caixas, potência ou observações.
      placeholder: |
        Ex:
        - Canais: 24
        - Potência: 18.000 W
  - type: textarea
    id: outros_recursos
    attributes:
      label: Outros recursos técnicos
      description: Use apenas para algo técnico que não esteja nos dropdowns.
      placeholder: |
        Ex:
        - Processador de áudio identificado
        - Recurso técnico documentado pela fabricante
  - type: textarea
    id: fontes
    attributes:
      label: Fontes
      description: Links, fotos, visita presencial, relato identificado ou observações.
      placeholder: |
        Ex:
        - https://...
        - Foto da placa técnica
        - Visita em 2026-05-10
    validations:
      required: true
  - type: textarea
    id: observacoes
    attributes:
      label: Observações adicionais
      description: Qualquer contexto útil para revisar os dados.
