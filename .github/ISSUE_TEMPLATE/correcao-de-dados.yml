name: Correção de dados
description: Corrija informação existente de uma rede, cinema ou sala.
title: "[correção] "
labels:
  - dados
  - correcao
body:
  - type: markdown
    attributes:
      value: |
        Use este modelo para apontar erro, dado desatualizado ou informação incompleta.
  - type: input
    id: item
    attributes:
      label: Item a corrigir
      description: Rede, cinema e sala afetados.
      placeholder: "Ex: Cinépolis JK Iguatemi / Sala 1"
    validations:
      required: true
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de correção
      options:
        - Nome, rede ou endereço
        - Tipo de sala
        - Sistema
        - Experiência
        - Projeção
        - Resolução
        - Tela
        - Som
        - Capacidade
        - Fonte ou observação
        - Outro
    validations:
      required: true
  - type: dropdown
    id: classificacao_sala
    attributes:
      label: Classificação da sala
      description: Se a correção envolver tipo, sistema ou experiência, selecione as opções canônicas aplicáveis.
      multiple: true
      options:
        - Tipo de sala — VIP
        - Tipo de sala — VIP Lounge
        - Sistema — IMAX
        - Sistema — Macro XE
        - Experiência — 3D
        - Experiência — 4DX — efeitos físicos
        - A confirmar
  - type: dropdown
    id: classificacao_padronizada
    attributes:
      label: Classificação técnica correta
      description: Se a correção envolver projeção, tela ou som, selecione as opções canônicas aplicáveis.
      multiple: true
      options:
        - Projeção — Laser
        - Projeção — Laser RGB
        - Projeção — Xenon
        - Projeção — LED
        - Projeção — Película 70 mm
        - Projeção — Tela LED
        - Resolução — 2K
        - Resolução — 4K
        - Som — Dolby Atmos
        - Som — Dolby Digital 5.1
        - Som — Dolby Digital 7.1
        - Som — IMAX
        - Layout de som — 5.1
        - Layout de som — 7.1
        - Layout de som — 11.1
        - Processamento — Harman Quantum Logic (JBL)
        - Tecnologia da tela — LED modular
        - Superfície da tela — Perolizada
        - Geometria da tela — Plana
        - Geometria da tela — Curva
        - A confirmar
  - type: textarea
    id: atual
    attributes:
      label: O que está errado ou incompleto?
      placeholder: "Descreva o dado atual que precisa mudar."
    validations:
      required: true
  - type: textarea
    id: correto
    attributes:
      label: Qual é a informação correta?
      placeholder: "Informe a correção proposta."
    validations:
      required: true
  - type: textarea
    id: fontes
    attributes:
      label: Fontes
      description: Links, fotos, visita presencial, relato identificado ou observações.
      placeholder: |
        Ex:
        - https://...
        - Foto da sala
        - Visita em 2026-05-10
    validations:
      required: true
  - type: textarea
    id: observacoes
    attributes:
      label: Observações adicionais
