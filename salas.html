<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salas | CinemasWiki</title>
    <meta name="description" content="Pesquisa de salas catalogadas no CinemasWiki.">
    <link rel="stylesheet" href="assets/styles.css?v=7">
    <link rel="stylesheet" href="assets/lab-theme.css?v=5">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  </head>
  <body class="lab-theme catalog-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="CinemasWiki inicio">
        <img class="brand-mark" src="assets/cinemaswiki-mark.png" alt="">
        <span>Cinemas<strong>Wiki</strong></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
        <svg class="lab-icon" aria-hidden="true"><use href="assets/lab-icons.svg#menu"></use></svg>
        <span class="visually-hidden">Abrir navegação</span>
      </button>
      <nav class="nav" id="primary-nav" aria-label="Navegacao principal">
        <a href="salas.html" aria-current="page">Pesquisar</a>
        <a href="cinemas.html">Cinemas</a>
        <a href="formatos.html">Formatos</a>
        <a href="estatisticas.html">Estatísticas</a>
        <a href="contribuir.html">Contribuir</a>
      </nav>
    </header>

    <main>
      <h1 class="visually-hidden">Pesquisar salas de cinema</h1>
      <section class="filters">
        <form class="filter-form" role="search">
          <label class="search-field">
            <span>Pesquisar no catálogo</span>
            <div class="search-input">
              <span aria-hidden="true"><svg class="lab-icon"><use href="assets/lab-icons.svg#search"></use></svg></span>
              <input id="search" type="search" placeholder="Cinema, bairro, IMAX, Dolby Atmos, laser..." autocomplete="off">
              <kbd>/</kbd>
            </div>
          </label>
          <button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="true" aria-controls="filter-grid">
            <svg class="lab-icon" aria-hidden="true"><use href="assets/lab-icons.svg#filter"></use></svg>
            <span>Filtros técnicos</span>
            <strong id="active-filter-count">0</strong>
            <svg class="lab-icon" aria-hidden="true"><use href="assets/lab-icons.svg#chevron-down"></use></svg>
          </button>
          <div class="filter-grid" id="filter-grid">
            <label>
              <span>Sistema</span>
              <select id="system"><option value="">Todos</option></select>
            </label>
            <label>
              <span>Experiência</span>
              <select id="experience"><option value="">Todas</option></select>
            </label>
            <label>
              <span>Projeção</span>
              <select id="projection"><option value="">Todas</option></select>
            </label>
            <label>
              <span>Resolução</span>
              <select id="resolution"><option value="">Todas</option></select>
            </label>
            <label>
              <span>Formato de som</span>
              <select id="sound"><option value="">Todos</option></select>
            </label>
            <label>
              <span>Layout</span>
              <select id="sound-layout"><option value="">Todos</option></select>
            </label>
            <label>
              <span>Ordenar</span>
              <select id="sort">
                <option value="name">Cinema, A–Z</option>
                <option value="coverage">Mais dados primeiro</option>
                <option value="updated">Atualizados recentemente</option>
              </select>
            </label>
            <button class="clear-filters" id="clear-filters" type="button">
              <svg class="lab-icon" aria-hidden="true"><use href="assets/lab-icons.svg#reset"></use></svg>
              Limpar filtros
            </button>
          </div>
        </form>
      </section>

      <section class="results-summary" aria-live="polite">
        <strong id="result-count">0 salas</strong>
        <span id="result-context">em todos os cinemas catalogados</span>
      </section>

      <section class="detail-view" id="room-detail" hidden></section>

      <section class="room-table" aria-label="Resultados da pesquisa">
        <div class="room-table-head" aria-hidden="true">
          <span><svg class="lab-icon"><use href="assets/lab-icons.svg#room"></use></svg></span>
          <span>Sala</span>
          <span><svg class="lab-icon"><use href="assets/lab-icons.svg#projector"></use></svg>Projeção</span>
          <span><svg class="lab-icon"><use href="assets/lab-icons.svg#resolution"></use></svg>Resolução</span>
          <span><svg class="lab-icon"><use href="assets/lab-icons.svg#sound"></use></svg>Som</span>
          <span><svg class="lab-icon"><use href="assets/lab-icons.svg#screen"></use></svg>Tela</span>
          <span aria-hidden="true"></span>
        </div>
        <div id="room-list" aria-live="polite"></div>
      </section>

      <nav class="pagination" id="pagination" aria-label="Paginacao de salas"></nav>
    </main>

    <footer class="footer">
      <div>
        <strong>CinemasWiki</strong>
        <span>Criado por Felipe Públio, desenvolvedor e apaixonado por cinema.</span>
      </div>
      <nav class="footer-links" aria-label="Contatos de Felipe Públio">
        <a href="https://twitter.com/publi0">Twitter @publi0</a>
        <a href="https://github.com/publi0">GitHub @publi0</a>
        <a href="mailto:felipe@publio.dev">felipe@publio.dev</a>
      </nav>
    </footer>

    <script src="assets/shell.js"></script>
    <script type="module" src="assets/app.js"></script>
  </body>
</html>
