<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cinemas | CinemasWiki</title>
    <meta name="description" content="Redes, cinemas e salas catalogadas no CinemasWiki.">
    <link rel="canonical" href="https://cinemaswiki.publio.dev/cinemas.html">
    <link rel="stylesheet" href="assets/styles.css?v=7">
    <link rel="stylesheet" href="assets/lab-theme.css?v=5">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  </head>
  <body class="lab-theme">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="CinemasWiki início">
        <img class="brand-mark" src="assets/cinemaswiki-mark.png" alt="">
        <span>Cinemas<strong>Wiki</strong></span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
        <svg class="lab-icon" aria-hidden="true"><use href="assets/lab-icons.svg#menu"></use></svg>
        <span class="visually-hidden">Abrir navegação</span>
      </button>
      <nav class="nav" id="primary-nav" aria-label="Navegação principal">
        <a href="salas.html">Pesquisar</a>
        <a href="cinemas.html" aria-current="page">Cinemas</a>
        <a href="formatos.html">Formatos</a>
        <a href="estatisticas.html">Estatísticas</a>
        <a href="contribuir.html">Contribuir</a>
      </nav>
    </header>

    <main>
      <section class="detail-view" id="room-detail" hidden></section>

      <section class="structure" id="estrutura" aria-labelledby="estrutura-title">
        <div class="section-heading">
          <p class="eyebrow">Por local</p>
          <h1 id="estrutura-title">Cinemas catalogados</h1>
          <p>Busque por rede, cinema, bairro ou sala.</p>
        </div>
        <label class="cinema-search">
          <span>Pesquisar cinemas</span>
          <div class="search-input">
            <span aria-hidden="true"><svg class="lab-icon"><use href="assets/lab-icons.svg#search"></use></svg></span>
            <input id="cinema-search" type="search" placeholder="Rede, cinema, bairro ou sala..." autocomplete="off">
          </div>
        </label>
        <p class="network-summary" id="network-summary" aria-live="polite"></p>
        <div class="network-tree" id="network-tree"></div>
        <nav class="pagination" id="network-pagination" aria-label="Paginação de redes"></nav>
      </section>
    </main>

    <footer class="footer">
      <div>
        <strong>CinemasWiki</strong>
        <span>Criado por Felipe Públio, desenvolvedor e apaixonado por cinema.</span>
      </div>
      <nav class="footer-links" aria-label="Contatos de Felipe Públio">
        <a href="https://twitter.com/publi0">Twitter @publi0</a>
        <a href="https://github.com/publi0">GitHub @publi0</a>
        <a href="mailto:felipe@publio.dev">felipe@publio.dev</a>
      </nav>
